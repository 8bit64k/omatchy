name: omatchy
label: "Omatchy"
description: "Neutral base for Omarchy theme bridge"
assets:
  bg: none  # suppress default dashboard background texture for clean solid fills
palette:
  background:
    hex: "#0a0a0a"
    alpha: 1.0
  midground:
    hex: "#a0a0a0"
    alpha: 1.0
  foreground:
    hex: "#ffffff"
    alpha: 0.0
  warmGlow: "rgba(128, 128, 128, 0.22)"
  noiseOpacity: 0.8
layout:
  radius: "0.5rem"
  density: comfortable
layoutVariant: standard
customCSS: |
  /* Override hardcoded black overlay on mobile sidebar flyout
     so light themes don't look muddy when the sidebar slides out. */
  [class*="bg-black/60"] {
    background-color: color-mix(in srgb, var(--background-base) 60%, transparent) !important;
  }
typography:
  fontSans: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "0"
